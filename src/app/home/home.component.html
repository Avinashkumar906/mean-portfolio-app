
<section class='d-flex align-items-center justify-content-center section section-main h-100 w-100' style="overflow: hidden;">
  <!-- [style.background-image]="'url(' + user?.image  + ')'" -->
  <div class='inner w-100' *ngIf="user ; else noData">
    <div class='intro-text hero-content' data-aos="fade-in">
      <h1 class="h1" data-aos="flip-up">
        <span>Hey, I am </span>
        <span class="highlight"> {{ user?.name }}. </span>
      </h1>
      <p class="p" data-aos="flip-down">{{ user?.bio }}</p>
      <div class='intro-btns'>
        <a [routerLink]="['/about']" data-aos="fade-right" class='btn-custom'>
          About
        </a>
        <a [routerLink]="['/contact']" data-aos="fade-left" class='btn-custom'>
          Contact Me
        </a>
      </div>
      <div *ngIf="isEditMode()" class='intro-btns'>
        <div class="m-auto" style="max-width:500px">
          <div class="form-group">
            <input class="form-control" type="text" [(ngModel)]="user.name" />
          </div>
          <div class="form-group">
            <input class="form-control" type="text" [(ngModel)]="user.bio" />
          </div>
          <!-- <div class="form-group">
            <input class="form-control" type="text" [(ngModel)]="user.image" />
          </div> -->
        </div>
      </div>
    </div>
    <div *ngIf="isEditMode()" class="sticky-bottom">
      <button class="btn-custom sticky-bottom-button mx-1" (click)="saveToServer()">Save</button>
      <button class="btn-custom sticky-bottom-button mx-1" (click)="toggleEdit()">Close</button>
    </div>
  </div>
</section>
<ng-template #noData>
  <section class='section resume-section border-d'>
    <div class="row align-items-center">
      <div class="col">
        <div class="text-center">
          <h2 class="h2">
            Unable to connect to server!
          </h2>
        </div>
      </div>
    </div>
  </section>
</ng-template>
