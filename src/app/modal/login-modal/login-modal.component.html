<ngx-smart-modal #loginModal identifier="loginModal" [closable]="false" [dismissable]="true">
  <div class="container h-100" style="max-width: 520px; width:100%; background: #F0F0F0">
    <div class="wrapper">
      <div class="col-12">
        <div class="login-form">
          <h2 class="h2">{{!isNewUser ? 'Signin' : 'Signup'}}</h2>
          <form #f="ngForm" (ngSubmit)="f.valid && onSubmit(f)" novalidate autocomplete="off">
            <div *ngIf="isNewUser" class="form-group">
              <input type="text" class="form-control" height="40px" placeholder="Your Name *" name="name" ngModel
                minlength="4" required>
            </div>
            <div class="form-group">
              <input type="text" class="form-control" height="40px" placeholder="Your Email *" name="email" ngModel
                minlength="4" required>
            </div>
            <div class="form-group">
              <input type="password" class="form-control" height="40px" placeholder="Your Password *" name="password"
                ngModel minlength="4" required>
            </div>
            <div class="form-group text-center">
              <button *ngIf="!isNewUser" type="submit" class="btn-color" [disabled]="!f.valid">Signin</button>
              <button *ngIf="isNewUser" type="submit" class="btn-color" [disabled]="!f.valid">Signup</button>
              <button (click)="toggleForm()" class="ml-2 btn-color" type="button">
                {{isNewUser ? 'Existing user' : 'New user'}}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</ngx-smart-modal>
